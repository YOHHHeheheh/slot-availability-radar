<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RailYatra — Book Indian train tickets with ease. Search trains, compare prices, and book seats or apply for waiting list.">
  <title>RailYatra — Train Seat Booking Portal</title>
  <meta charset="UTF-8" />
  <title>RailYatra — Train Seat Booking Portal</title>
  
  <!-- Add your favicon here -->
  <link rel="icon" type="image/png" href="https://cdn.phototourl.com/free/2026-08-19-76118bb4-a28d-4fdc-ba7e-831e129bc135.png" />
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Navbar layout */
.navbar {
  display: flex;
  justify-content: space-between; /* Pushes logo left, button right */
  align-items: center;
  padding: 15px 40px;
  background-color: transparent; /* Adjust color to match your current header shade */
  width: 100%;
}

/* Sign In Button styling matching UI scheme */
.btn-signin {
  padding: 8px 20px;
  border: 1px solid #7cb3be; /* Theme accent color */
  border-radius: 6px;
  color: #ffffff;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.3s ease;
}

/* Hover Effect */
.btn-signin:hover {
  background-color: #7cb3be;
  color: #1a3b47;
}
    /* Station dropdown styles */
    .station-input-wrapper {
      position: relative;
    }
    .station-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 240px;
      overflow-y: auto;
      background: rgba(243, 233, 220, 0.97);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(192, 133, 82, 0.25);
      border-top: none;
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      box-shadow: 0 8px 24px rgba(94, 48, 35, 0.15);
      z-index: 100;
    }
    .station-dropdown.visible { display: block; }
    .station-option {
      padding: 10px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.15s;
      border-bottom: 1px solid rgba(192, 133, 82, 0.08);
    }
    .station-option:hover {
      background: rgba(192, 133, 82, 0.12);
    }
    .station-opt-code {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--amber);
      min-width: 45px;
      letter-spacing: 0.04em;
    }
    .station-opt-name {
      font-size: 0.88rem;
      color: var(--deep-brown);
      flex: 1;
    }
    .station-opt-city {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Swap button */
    .swap-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(192, 133, 82, 0.3);
      background: rgba(243, 233, 220, 0.6);
      color: var(--amber);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      flex-shrink: 0;
      margin-top: 20px;
    }
    .swap-btn:hover {
      background: var(--amber);
      color: var(--cream);
      transform: rotate(180deg);
    }

    /* Station row layout */
    .station-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .station-row .form-group { flex: 1; }

    /* Form section spacing */
    .form-section {
      margin-bottom: 28px;
    }
    .form-section:last-child { margin-bottom: 0; }

    /* Options row */
    .options-row {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    /* Heritage banner text */
    .heritage-text {
      text-align: center;
      margin-top: 20px;
      font-size: 0.82rem;
      color: rgba(243, 233, 220, 0.5);
      font-style: italic;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>

 <nav>
  <!-- Logo Container -->
  <div>
    <a href="index.html" title="RailYatra - Futuristic Journey Solutions">
      <img alt="RailYatra - Futuristic Journey Solutions" src="https://cdn.phototourl.com/free/2026-08-19-053d87a8-767c-47d0-b0b3-64b555b55510.png">
    </a>
  </div>

  <!-- Add this new container for the button -->
  <div class="nav-actions">
    <a href="#signin" class="btn-signin">Sign In</a>
  </div>
</nav>

  <!-- Hero Section -->
<section class="hero" id="hero">
    <!-- Slideshow Background -->
    <div class="hero-slideshow">
    <div class="slide" style="background-image: url('heritage-train.jpg')"></div>
    <div class="slide" style="background-image: url('train-evolution.jpg')"></div>
    <div class="slide" style="background-image: url('modern-train.jpg')"></div>
</div>
    <div class="hero-overlay"></div>

    <!-- Booking Form -->
    <div class="hero-content">
      <h1 class="hero-title">Book Your Journey Across India</h1>
      <p class="hero-subtitle">From heritage routes to high-speed rail — your adventure begins here</p>

      <form class="booking-form" id="booking-form" autocomplete="off">

        <!-- Journey Details -->
        <div class="form-section">
          <h3 class="section-title"><span class="icon">📍</span> Journey Details</h3>

          <div class="station-row">
            <div class="form-group">
              <label for="from-station">From Station</label>
              <div class="station-input-wrapper">
                <input type="text" id="from-station" class="form-control station-input" placeholder="Search city or station..." required>
                <div class="station-dropdown"></div>
              </div>
            </div>

            <button type="button" class="swap-btn" onclick="swapStations()" title="Swap stations">⇄</button>

            <div class="form-group">
              <label for="to-station">To Station</label>
              <div class="station-input-wrapper">
                <input type="text" id="to-station" class="form-control station-input" placeholder="Search city or station..." required>
                <div class="station-dropdown"></div>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="journey-date">Date of Journey</label>
              <input type="date" id="journey-date" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="pref-time">Preferred Departure</label>
              <select id="pref-time" class="form-control">
                <option value="any">Any Time</option>
                <option value="morning">Morning (6 AM – 12 PM)</option>
                <option value="afternoon">Afternoon (12 PM – 5 PM)</option>
                <option value="evening">Evening (5 PM – 9 PM)</option>
                <option value="night">Night (9 PM – 6 AM)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="travel-class">Travel Class</label>
              <select id="travel-class" class="form-control">
                <option value="">All Classes</option>
                <option value="SL">Sleeper (SL)</option>
                <option value="3A">3rd AC (3A)</option>
                <option value="2A">2nd AC (2A)</option>
                <option value="1A">1st AC (1A)</option>
              </select>
            </div>
          </div>
        </div>



        <!-- Additional Options -->
        <div class="form-section">
          <h3 class="section-title"><span class="icon">⚙️</span> Additional Options</h3>
          <div class="options-row">
            <div class="toggle-wrapper">
              <label class="toggle-switch">
                <input type="checkbox" id="tatkal-toggle">
                <span class="toggle-slider"></span>
              </label>
              <span class="toggle-label">Tatkal Booking</span>
            </div>
            <div class="toggle-wrapper">
              <label class="toggle-switch">
                <input type="checkbox" id="senior-toggle">
                <span class="toggle-slider"></span>
              </label>
              <span class="toggle-label">Senior Citizen Concession</span>
            </div>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">
          🔍 Search Trains
        </button>
      </form>

      <p class="heritage-text">Celebrating India's rail heritage — from the Fairy Queen (1855) to Vande Bharat</p>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
