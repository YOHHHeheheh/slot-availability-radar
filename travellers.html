<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RailYatra — Train Seat Booking Portal</title>
  
  <!-- Add your favicon here -->
  <link rel="icon" type="image/png" href="https://cdn.phototourl.com/free/2026-08-19-76118bb4-a28d-4fdc-ba7e-831e129bc135.png" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RailYatra — Enter traveller details to complete your train booking.">
  <title>Traveller Details — RailYatra</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar scrolled" id="main-navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand" title="RailYatra - Futuristic Journey Solutions">
        <img src="https://cdn.phototourl.com/free/2026-08-19-053d87a8-767c-47d0-b0b3-64b555b55510.png" alt="RailYatra - Futuristic Journey Solutions" class="main-brand-logo">
      </a>
    </div>
  </nav>

  <div class="page-wrapper">
    <div class="container">
      <a href="trains.html" class="back-link">← Back to Trains</a>

      <h1 style="font-family: var(--font-heading); font-size: 2rem; margin-bottom: 32px; color: var(--deep-brown);">
        Enter Traveller Details
      </h1>

      <form id="travellers-form" class="booking-form" style="max-width: 900px; margin: 0 auto; animation: none;">
        <!-- Traveller Details -->
        <div class="form-section">
          <h3 class="section-title"><span class="icon">👤</span> Traveller Details</h3>

          <div id="travellers-container">
            <!-- Traveller 1 (default) -->
            <div class="traveller-card" data-index="1">
              <div class="traveller-header">
                <span class="traveller-number">Traveller 1</span>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="name-1">Full Name</label>
                  <input type="text" id="name-1" class="form-control traveller-name" placeholder="As on ID proof" required>
                </div>
                <div class="form-group">
                  <label for="age-1">Age</label>
                  <input type="number" id="age-1" class="form-control traveller-age" min="1" max="120" placeholder="Age" required>
                </div>
                <div class="form-group">
                  <label for="gender-1">Gender</label>
                  <select id="gender-1" class="form-control traveller-gender" required>
                    <option value="">Select</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="id-type-1">ID Type</label>
                  <select id="id-type-1" class="form-control traveller-id-type" required>
                    <option value="">Select</option>
                    <option value="Aadhaar">Aadhaar Card</option>
                    <option value="Passport">Passport</option>
                    <option value="PAN">PAN Card</option>
                    <option value="VoterID">Voter ID</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="id-num-1">ID Number</label>
                  <input type="text" id="id-num-1" class="form-control traveller-id-num" placeholder="ID Number" required>
                </div>
                <div class="form-group">
                  <label for="berth-1">Berth Preference</label>
                  <select id="berth-1" class="form-control traveller-berth">
                    <option value="No Preference">No Preference</option>
                    <option value="Lower">Lower</option>
                    <option value="Middle">Middle</option>
                    <option value="Upper">Upper</option>
                    <option value="Side Lower">Side Lower</option>
                    <option value="Side Upper">Side Upper</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <button type="button" class="add-traveller-btn" id="add-traveller-btn">
            + Add Another Traveller
          </button>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">
          Proceed to Payment ➔
        </button>
      </form>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
