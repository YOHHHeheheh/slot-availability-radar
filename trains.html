<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RailYatra — Browse available trains, compare prices, and book your preferred seats or apply for waiting list.">
  <title>Available Trains — RailYatra</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar scrolled" id="main-navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand" title="RailYatra - Futuristic Journey Solutions">
        <img src="images/logo.svg" alt="RailYatra - Futuristic Journey Solutions" class="main-brand-logo">
      </a>
    </div>
  </nav>

  <div class="page-wrapper">

    <!-- Search Summary Banner -->
    <div class="search-summary">
      <div class="container">
        <div class="route">
          <span class="station-name" id="summary-from">—</span>
          <span class="route-arrow">→</span>
          <span class="station-name" id="summary-to">—</span>
        </div>
        <div class="route-meta" id="summary-meta">—</div>
      </div>
    </div>

    <div class="container">
      <!-- Back link -->
      <a href="index.html" class="back-link">← Modify Search</a>

      <!-- Sort & Filter Bar -->
      <div class="sort-filter-bar">
        <div class="filter-group">
          <label for="sort-select">Sort by</label>
          <select id="sort-select">
            <option value="price-asc">Price: Low → High</option>
            <option value="price-desc">Price: High → Low</option>
            <option value="dep-earliest">Departure: Earliest</option>
            <option value="arr-earliest">Arrival: Earliest</option>
            <option value="duration-short">Duration: Shortest</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="train-type-filter">Type</label>
          <select id="train-type-filter">
            <option value="all">All Types</option>
            <option value="Superfast">Superfast</option>
            <option value="Express">Express</option>
            <option value="Mail">Mail</option>
            <option value="Vande Bharat">Vande Bharat</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Filter</label>
          <div class="filter-chips">
            <button class="filter-chip" data-filter="direct" data-group="route">Non-stop</button>
            <button class="filter-chip" data-filter="stops" data-group="route">With Stops</button>
            <button class="filter-chip" data-filter="available">Available Only</button>
          </div>
        </div>

        <div class="filter-group" style="margin-left: auto;">
          <span id="train-count" style="font-size:0.85rem; font-weight:600; color:var(--text-muted);">—</span>
        </div>
      </div>

      <!-- Train List -->
      <div class="train-list" id="train-list">
        <!-- Trains rendered by JS -->
        <div class="no-results">
          <div class="empty-icon">⏳</div>
          <h3>Loading trains...</h3>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
