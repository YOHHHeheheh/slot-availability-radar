<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RailYatra — Train Seat Booking Portal</title>
  
  <!-- Add your favicon here -->
  <link rel="icon" type="image/png" href="https://cdn.phototourl.com/free/2026-08-19-76118bb4-a28d-4fdc-ba7e-831e129bc135.png" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RailYatra — Booking confirmed.">
  <title>Booking Confirmed — RailYatra</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .confirmation-card {
      max-width: 600px;
      margin: 40px auto;
      text-align: center;
      padding: 40px;
    }
    .success-icon {
      font-size: 4rem;
      margin-bottom: 20px;
    }
    .pnr-box {
      background: rgba(40, 90, 114, 0.1);
      border: 2px dashed var(--deep-brown);
      padding: 20px;
      margin: 30px 0;
      border-radius: var(--radius-md);
    }
    .pnr-box .pnr-label {
      font-size: 0.9rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .pnr-box .pnr-number {
      font-family: var(--font-heading);
      font-size: 2.5rem;
      color: var(--amber);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar scrolled" id="main-navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand" title="RailYatra - Futuristic Journey Solutions">
        <img src="https://cdn.phototourl.com/free/2026-08-19-053d87a8-767c-47d0-b0b3-64b555b55510.png" alt="RailYatra - Futuristic Journey Solutions" class="main-brand-logo">
      </a>
      <div class="navbar-right">
        <div class="navbar-datetime" id="navbar-datetime"></div>
      </div>
    </div>
  </nav>

  <div class="page-wrapper">
    <div class="container">
      <div class="glass-card confirmation-card">
        <div class="success-icon">✅</div>
        <h1 style="color: var(--deep-brown); margin-bottom: 12px;">Seat Booked Confirmed!</h1>
        <p style="color: var(--text-muted);">Your payment was successful and your tickets have been issued.</p>
        
        <div class="pnr-box">
          <div class="pnr-label">Your PNR Number</div>
          <div class="pnr-number" id="confirm-pnr">LOADING...</div>
        </div>

        <p style="margin-bottom: 30px;">An SMS and email with your ticket details have been sent to your registered contact details.</p>

        <a href="index.html" class="btn btn-primary btn-lg">Back to Home</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    function updateNavbarDateTime() {
      const now = new Date();
      const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
      const dateStr = now.toLocaleDateString('en-IN', options);
      const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
      const el = document.getElementById('navbar-datetime');
      if (el) el.textContent = dateStr + '  \u2022  ' + timeStr;
    }
    updateNavbarDateTime();
    setInterval(updateNavbarDateTime, 1000);
  </script>
</body>
</html>
